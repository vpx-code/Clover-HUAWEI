plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'org.jetbrains.kotlin.plugin.serialization' version '1.6.0'
    id 'com.huawei.agconnect'
}

android {
    compileSdk 33

    defaultConfig {
        applicationId "com.xvlaze.clover"
        minSdk 27
        targetSdk 33
        versionCode 4
        versionName "1.1.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            storeFile file('cloverharmony.jks')
            keyAlias project.findProperty('KEY_ALIAS') ?: 'mobile-release'
            keyPassword project.findProperty('KEY_PASSWORD')
            storePassword project.findProperty('STORE_PASSWORD')
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.release
            // minifyEnabled true
            // shrinkResources true
            // proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            signingConfig signingConfigs.release
            shrinkResources false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
        freeCompilerArgs += [
                "-Xjvm-default=all",
        ]
    }
    buildFeatures{
        viewBinding = true
    }
    namespace 'com.xvlaze.clover'
}

dependencies {
    implementation 'androidx.core:core-ktx:1.7.0'
    implementation 'androidx.appcompat:appcompat:1.4.1'
    implementation 'com.google.android.material:material:1.5.0'
    testImplementation 'junit:junit:'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.0-alpha06'

    implementation 'androidx.constraintlayout:constraintlayout:2.1.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.3.1'

    implementation 'androidx.activity:activity-ktx:1.4.0'
    implementation 'androidx.fragment:fragment-ktx:1.4.1'
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.4.1"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.4.1"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.4.1"
    implementation "androidx.lifecycle:lifecycle-extensions:2.2.0"
    implementation 'com.karumi:dexter:6.2.3'
    implementation 'com.github.CanHub:Android-Image-Cropper:4.2.1'
    implementation 'com.github.amlcurran.showcaseview:library:5.4.3'

    implementation 'com.huawei.hms:ml-computer-vision-ocr:3.3.0.301'
    implementation 'com.huawei.hms:ml-computer-vision-ocr-latin-model:3.3.0.301'
    implementation 'com.huawei.hms:ml-computer-vision-ocr-cn-model:3.3.0.301'
    implementation 'com.huawei.hms:maps:6.3.1.300'
    implementation 'com.huawei.hms:site:6.2.0.301'
    implementation 'com.huawei.hms:location:6.3.0.300'
    implementation 'com.huawei.hms:hianalytics:6.4.0.300'
    implementation 'com.huawei.agconnect:agconnect-core:1.6.4.300'
    implementation 'com.huawei.hms:wearengine:5.0.1.302'

    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation 'androidx.databinding:baseLibrary:3.2.0-alpha11'
    testImplementation 'junit:junit:'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.0-alpha06'
    androidTestImplementation 'androidx.test:rules:1.4.1-alpha05'
    implementation 'com.github.Binary-Finery:Bungee:3.0'
    implementation 'com.github.MatteoBattilana:WeatherView:3.0.0'
    implementation 'com.github.bumptech.glide:glide:4.13.0'
    implementation 'com.jakewharton:butterknife:10.2.3'
    implementation 'com.jakewharton.timber:timber:5.0.1'
    annotationProcessor 'com.jakewharton:butterknife-compiler:10.2.3'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.13.0'
    implementation 'com.github.Q42:AndroidScrollingImageView:1.3.4'
}

